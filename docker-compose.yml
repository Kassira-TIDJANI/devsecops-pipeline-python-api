services:
  api:
    container_name: api-beers
    build: ./api
    environment:
      - FLASK8_APP=routes.py
    ports:
      - 80:5000
    depends_on:
      - db-beers

  db-beers:
    container_name: db-beers
    build: ./sql
    ports:
      - 3306:3306
    environment:
      -  MYSQL_ROOT_PASSWORD=root
      -  MYSQL_DATABASE=beer
      -  MYSQL_USER=user1
      -  MYSQL_PASSWORD=user1_password