services:
  api:
    container_name: api-beers
    build: ./api
    environment:
      - FLASK8_APP=routes.py
      - DB_HOST=db_beer            
      - DB_USER=user_beer          
      - DB_PASSWORD=userbeer_password 
      - DB_NAME=beer
    ports:
      - 80:5000
    depends_on:
      - db

  db:
    container_name: db-beer
    build: ./sql
    ports:
      - 3306:3306
    environment:
      -  MYSQL_ROOT_PASSWORD=root
      -  MYSQL_DATABASE=beer
      -  MYSQL_USER=user_beer
      -  MYSQL_PASSWORD=userbeer_password
    
    volumes:
    - ./sql/beer.sql:/docker-entrypoint-initdb.d/beer.sql